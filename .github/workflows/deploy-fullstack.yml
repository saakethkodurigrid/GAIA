name: Deploy Full Stack (Backend + Frontend)

on:
  push:
    branches:
      - dev_v1
  workflow_dispatch:

env:
  AZURE_SUBSCRIPTION_ID: dab771f2-8670-4bf4-8067-ea813decb669
  AZURE_RESOURCE_GROUP: ai-ta-2
  CONTAINER_REGISTRY: acrgaia
  CONTAINER_APP: gaia-backend
  STATIC_WEB_APP: gaia-frontend
  REGISTRY_LOGIN_SERVER: acrgaia.azurecr.io

jobs:
  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          cred-type: idtoken
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: eccbc9a0-56ca-4467-bacd-c7b7d36ef395
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: |
          az acr login --name ${{ env.CONTAINER_REGISTRY }}

      - name: Get version from git
        id: version
        run: |
          VERSION=$(git rev-parse --short HEAD)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Build and push Docker image
        run: |
          IMAGE_TAG="${{ env.REGISTRY_LOGIN_SERVER }}/gaia-backend:${{ steps.version.outputs.version }}"
          LATEST_TAG="${{ env.REGISTRY_LOGIN_SERVER }}/gaia-backend:latest"
          
          docker build \
            --platform linux/amd64 \
            --file backend/Dockerfile \
            --tag $IMAGE_TAG \
            --tag $LATEST_TAG \
            backend/
          
          docker push $IMAGE_TAG
          docker push $LATEST_TAG
          
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Deploy to Azure Container App
        run: |
          az containerapp update \
            --name ${{ env.CONTAINER_APP }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --image ${{ env.IMAGE_TAG }}

      - name: Wait and verify backend
        run: |
          sleep 30
          HEALTH_URL="https://gaia-backend.politefield-9abbbc93.eastus.azurecontainerapps.io/health"
          RESPONSE=$(curl -s $HEALTH_URL)
          if echo "$RESPONSE" | grep -q "healthy"; then
            echo "✅ Backend health check passed"
          else
            echo "❌ Backend health check failed: $RESPONSE"
            exit 1
          fi

  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          cred-type: idtoken
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: eccbc9a0-56ca-4467-bacd-c7b7d36ef395
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Get deployment token
        id: get-token
        run: |
          TOKEN=$(az staticwebapp secrets list \
            --name ${{ env.STATIC_WEB_APP }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query "properties.apiKey" -o tsv)
          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Deploy to Azure Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.get-token.outputs.token }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "frontend"
          output_location: "dist"
          skip_app_build: true

  deployment-summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend]
    if: always()

    steps:
      - name: Create summary
        run: |
          echo "## 🚀 Full Stack Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Backend" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ${{ needs.deploy-backend.result == 'success' && '✅ Success' || '❌ Failed' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **URL:** https://gaia-backend.politefield-9abbbc93.eastus.azurecontainerapps.io" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Frontend" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ${{ needs.deploy-frontend.result == 'success' && '✅ Success' || '❌ Failed' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **URL:** https://purple-stone-099e15c0f.3.azurestaticapps.net" >> $GITHUB_STEP_SUMMARY

