name: CI/CD Pipeline

on:
  push:
    branches: [cicddev]
  pull_request:
    branches: [cicddev]

env:
  DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
  BACKEND_IMAGE_NAME: gaia-backend
  FRONTEND_IMAGE_NAME: gaia-frontend

jobs:
  # ==================== BACKEND JOBS ====================
  backend-lint:
    name: Backend - Lint
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'
      
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install flake8 black pylint
      
      - name: Run Black (Code Formatter Check)
        run: |
          cd backend
          black --check --diff . || echo "⚠️  Code formatting issues found (non-blocking)"
        continue-on-error: true
      
      - name: Run Flake8 (Linter)
        run: |
          cd backend
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        continue-on-error: true
      
      - name: Run Pylint
        run: |
          cd backend
          pylint **/*.py --exit-zero || echo "⚠️  Pylint warnings found (non-blocking)"
        continue-on-error: true

  backend-test:
    name: Backend - Test & Smoke Test
    runs-on: ubuntu-latest
    needs: backend-lint
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'
      
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest pytest-cov
      
      - name: Run smoke tests
        run: |
          cd backend
          echo "🔍 Running smoke tests..."
          export DATABASE_URL="sqlite:///./test.db"
          python -c "from core.config import settings; print('✅ Config loads')"
          python -c "from api.v1.routes import auth_router; print('✅ Auth routes load')"
          python -c "from services.auth_service import AuthService; print('✅ Auth service loads')"
          echo "✅ All smoke tests passed!"
        
      - name: Run unit tests
        run: |
          cd backend
          if [ -d "tests" ] && [ "$(ls -A tests/*.py 2>/dev/null)" ]; then
            pytest tests/ -v --tb=short
          else
            echo "ℹ️  No unit tests found yet"
          fi
        continue-on-error: true

  backend-build:
    name: Backend - Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: backend-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/cicddev'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/gaia-backend:cicddev
            ${{ secrets.DOCKER_HUB_USERNAME }}/gaia-backend:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/gaia-backend:${{ github.sha }}
      
      - name: Image digest
        run: |
          echo "✅ Backend image pushed successfully"
          echo "📦 Image: ${{ secrets.DOCKER_HUB_USERNAME }}/gaia-backend"
          echo "🏷️  Tags: cicddev, latest, ${{ github.sha }}"

  # ==================== FRONTEND JOBS ====================
  frontend-lint:
    name: Frontend - Lint
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'
      
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      
      - name: Run ESLint
        run: |
          cd frontend
          npm run lint || echo "⚠️  ESLint warnings found (non-blocking)"
        continue-on-error: true
      
      - name: TypeScript type check
        run: |
          cd frontend
          npx tsc --noEmit

  frontend-test:
    name: Frontend - Test & Build
    runs-on: ubuntu-latest
    needs: frontend-lint
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'
      
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      
      - name: Build frontend
        run: |
          cd frontend
          npm run build
      
      - name: Smoke test build
        run: |
          cd frontend/dist
          echo "🔍 Checking build output..."
          ls -lah
          if [ -f "index.html" ]; then
            echo "✅ index.html found"
          else
            echo "❌ index.html not found"
            exit 1
          fi
          if [ -d "assets" ]; then
            echo "✅ assets directory found"
          fi
          echo "✅ Frontend build successful!"

  frontend-build:
    name: Frontend - Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: frontend-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/cicddev'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/gaia-frontend:cicddev
            ${{ secrets.DOCKER_HUB_USERNAME }}/gaia-frontend:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/gaia-frontend:${{ github.sha }}
      
      - name: Image digest
        run: |
          echo "✅ Frontend image pushed successfully"
          echo "📦 Image: ${{ secrets.DOCKER_HUB_USERNAME }}/gaia-frontend"
          echo "🏷️  Tags: cicddev, latest, ${{ github.sha }}"

  # ==================== DEPLOYMENT SUMMARY ====================
  deployment-summary:
    name: 🎉 Deployment Summary
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/cicddev'
    
    steps:
      - name: Summary
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║                                                              ║"
          echo "║           🎉 CI/CD PIPELINE COMPLETED SUCCESSFULLY! 🎉       ║"
          echo "║                                                              ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo ""
          echo "📦 Docker Images Published:"
          echo "  ✅ Backend:  ${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.BACKEND_IMAGE_NAME }}:latest"
          echo "  ✅ Frontend: ${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.FRONTEND_IMAGE_NAME }}:latest"
          echo ""
          echo "📝 Details:"
          echo "  Branch:     cicddev"
          echo "  Commit:     ${{ github.sha }}"
          echo "  Author:     ${{ github.actor }}"
          echo ""
          echo "🚀 Next Steps:"
          echo "  1. Pull images: docker pull <username>/<image>:latest"
          echo "  2. Deploy to your environment"
          echo "  3. Verify health checks"
          echo ""
          echo "╚══════════════════════════════════════════════════════════════╝"

